services:
  greengate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-greengate}:${TAG:-latest}
    container_name: greengate
    ports:
      - "8000:8000"
    environment:
      CARBON_THRESHOLD: "200"
      CARBON_API_URL: "https://api.carbonintensity.org.uk/intensity"
      CACHE_TTL: "300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
