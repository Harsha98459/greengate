apiVersion: apps/v1
kind: Deployment
metadata:
  name: greengate
  labels:
    app: greengate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greengate
  template:
    metadata:
      labels:
        app: greengate
    spec:
      containers:
        - name: greengate
          image: greengate:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CARBON_THRESHOLD
              value: "200"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
